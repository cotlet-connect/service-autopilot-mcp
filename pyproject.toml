[project]
name = "service-autopilot-mcp"
version = "1.1.0"
description = "Connect Service Autopilot to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Service Autopilot API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["service autopilot", "service autopilot api", "service autopilot mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/service-autopilot-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=service-autopilot"
Source = "https://github.com/cotlet-connect/service-autopilot-mcp"

[project.scripts]
service-autopilot-mcp = "service_autopilot_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"service_autopilot_agent.py" = "service_autopilot_agent.py"

[tool.hatch.build.targets.sdist]
include = ["service_autopilot_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
